# Coolify / production: mount persistent storage at /data (SQLite + templates).
# Without this volume, users and templates are lost on every container replace.
#
# Coolify UI: Application → Persistent Storage → Add
#   Name:     kitteasy-data   (any name)
#   Mount:    /data
#
# IMPORTANT: Do not rely on Dockerfile VOLUME for /data — anonymous volumes are
# recreated on redeploy and wipe accounts. Use a named Coolify volume instead.
#
# Required env:
#   DATA_DIR=/data
#   JWT_SECRET=<long random string — keep stable across deploys or sessions reset>
#   ADMIN_EMAIL / ADMIN_PASSWORD — required in production for first admin seed
#   ADMIN_PASSWORD_RESET=true — one-time only; remove after deploy or password keeps resetting
#   COOKIE_SECURE=true when the site is served over HTTPS (Coolify + TLS)
#
# Weekly backup (stored on the same /data volume under /data/backups/YYYY-MM-DD/):
#   BACKUP_ENABLED=true          default; set false to disable
#   BACKUP_WEEKDAY=1             0=Sun … 1=Mon (default) … 6=Sat
#   BACKUP_HOUR_UTC=3            hour to run (UTC), default 03:00 Monday
#   BACKUP_RETAIN_WEEKS=12       keep 12 weekly snapshots, prune older
# Manual backup inside container:
#   node /app/server/scripts/backup-data.mjs
# Restore one user workspace:
#   node /app/server/scripts/restore-backup.mjs 2026-08-25 --workspace-only USER_ID
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kitteasy.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-incorrect}
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_WEEKDAY: ${BACKUP_WEEKDAY:-1}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_RETAIN_WEEKS: ${BACKUP_RETAIN_WEEKS:-12}
      NODE_ENV: production
    volumes:
      - kitteasy-data:/data

volumes:
  kitteasy-data:
