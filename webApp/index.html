<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remotink</title>
    <!-- PNG first: Chrome/Edge tab icons are unreliable with SVG-only favicons. -->
    <link rel="icon" href="/favicon-32.png?v=7" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-64.png?v=7" type="image/png" sizes="64x64" />
    <link rel="icon" href="/favicon.svg?v=7" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon-32.png?v=7" />
    <link rel="apple-touch-icon" href="/favicon-64.png?v=7" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://generativelanguage.googleapis.com https://image.pollinations.ai https://api.iconify.design https://*.iconify.design"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; background: #0d0d10; color: #e2e2e8; font-family: system-ui, -apple-system, sans-serif; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #0d0d10; z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      .splash-logo {
        width: 56px; height: 56px; border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
      }
      .splash-logo img { width: 100%; height: 100%; display: block; }
      .splash-title { font-size: 15px; font-weight: 600; color: #e2e2e8; }
      .splash-sub { font-size: 12px; color: #6b6b80; }
      .splash-bar {
        width: 140px; height: 3px; background: #1e1e2d; border-radius: 99px; overflow: hidden;
      }
      .splash-fill {
        height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #8b5cf6);
        border-radius: 99px; animation: fill 2.5s ease-out forwards;
      }
      @keyframes fill { 0%{width:0%} 60%{width:70%} 100%{width:92%} }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-logo"><img src="/favicon.svg?v=7" alt="" width="56" height="56" /></div>
      <div class="splash-title">Remotink</div>
      <div class="splash-bar"><div class="splash-fill"></div></div>
      <div class="splash-sub">Starting up…</div>
    </div>

    <div id="root"></div>
    <script>
      window.__hideSplash = function() {
        var el = document.getElementById('splash');
        if (!el) return;
        el.classList.add('fade-out');
        setTimeout(function(){ el.remove(); }, 350);
      };
      // Fallback if the module bundle fails before it can dismiss the splash.
      setTimeout(function() {
        if (document.getElementById('splash')) window.__hideSplash();
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
